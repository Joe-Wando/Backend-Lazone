services:
  postgres:
    image: postgres:16
    container_name: lazone-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lazone
      POSTGRES_DB: lazone
    ports:
      - "5432:5432"
    volumes:
      - lazone-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lazone-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  lazone-data: