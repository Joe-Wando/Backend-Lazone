services:
  postgres:
    image: postgres:16
    container_name: lazone-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lazone
      POSTGRES_DB: lazone
    ports:
      - "5432:5432"
    volumes:
      - lazone-data:/var/lib/postgresql/data

volumes:
  lazone-data: