services:
  postgres:
    image: postgres:16
    container_name: lazone-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lazone
      POSTGRES_DB: lazone
    ports:
      - "5432:5432"
    volumes:
      - lazone-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lazone-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: lazone-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: lazone-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - lazone-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  lazone-data:
  lazone-grafana-data: